<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>404 — Page Not Found</title>
    <style>
      :root {
        --paper: #FAFAF7;
        --ink: #1B1D23;
        --ink-soft: #5B606B;
        --rule: #E4E1D8;
        --indigo: #4A55C4;
        --font-mono: ui-monospace, 'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        background-color: var(--paper);
        color: var(--ink);
        font-family: var(--font-mono);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      .card {
        max-width: 480px;
        width: 100%;
        background-color: var(--paper);
        border: 1px solid var(--rule);
        border-radius: 8px;
        box-shadow: 0 4px 12px rgba(27, 29, 35, 0.04);
        overflow: hidden;
      }
      .chrome-bar {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 12px 16px;
        background-color: var(--paper);
        border-bottom: 1px solid var(--rule);
      }
      .dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
      }
      .dot-red { background-color: #FF5F56; }
      .dot-yellow { background-color: #FFBD2E; }
      .dot-green { background-color: #27C93F; }
      .content {
        padding: 32px 24px;
      }
      .code-line {
        color: var(--ink-soft);
        font-size: 13px;
        margin-bottom: 16px;
      }
      .error-title {
        font-size: 20px;
        font-weight: 700;
        color: var(--ink);
        margin-bottom: 8px;
      }
      .error-desc {
        color: var(--ink-soft);
        font-size: 14px;
        line-height: 1.6;
        margin-bottom: 24px;
      }
      .home-link {
        display: inline-flex;
        align-items: center;
        padding: 8px 16px;
        background-color: var(--indigo);
        color: #ffffff;
        text-decoration: none;
        border-radius: 6px;
        font-size: 14px;
        font-weight: 600;
        transition: opacity 0.2s ease;
      }
      .home-link:hover {
        opacity: 0.9;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="chrome-bar">
        <span class="dot dot-red"></span>
        <span class="dot dot-yellow"></span>
        <span class="dot dot-green"></span>
      </div>
      <div class="content">
        <div class="code-line">HTTP 404 · FileNotFoundError</div>
        <h1 class="error-title">Page not found</h1>
        <p class="error-desc">The requested resource could not be found or may have been moved.</p>
        <a href="/" class="home-link">← Return to portfolio</a>
      </div>
    </div>
  </body>
</html>
